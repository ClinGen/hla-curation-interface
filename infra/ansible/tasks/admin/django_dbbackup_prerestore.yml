# Back up the database just before a restore overwrites it, so the restore can be
# undone and data entered since the restored backup can be copied back by hand.
- name: Read the Git SHA of the code being replaced
  ansible.builtin.slurp:
    src: "{{ repo_dir }}/src/version.txt"
  register: prerestore_version_file

- name: Name the pre-restore backup
  ansible.builtin.set_fact:
    prerestore_backup_name: "pre-restore/{{ subdomain }}-{{ current_sha }}-{{ backup_timestamp }}.sqlite3.gz"
  vars:
    current_sha: "{{ prerestore_version_file.content | b64decode | trim }}"
    backup_timestamp: "{{ now(utc=true, fmt='%Y-%m-%dT%H%M%SZ') }}"

- name: Back up the database before restoring
  ansible.builtin.command:
    chdir: "{{ repo_dir }}/src"
    cmd: "~/.local/bin/uv run manage.py dbbackup --noinput --compress -o {{ prerestore_backup_name }}"
  tags:
    - skip_ansible_lint

- name: Show the pre-restore backup's name
  ansible.builtin.debug:
    msg: "Pre-restore backup: {{ prerestore_backup_name }}"
