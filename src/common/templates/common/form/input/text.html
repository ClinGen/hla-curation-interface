<div class="field">
    {% if hide_label %}
        <label class="label is-hidden" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <div class="has-text-danger">{{ field.errors }}</div>
    {% else %}
        <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if public %} {% include "common/public_badge.html" %}{% endif %}</label>
        <div class="has-text-danger">{{ field.errors }}</div>
    {% endif %}
    {% if show_help and field.help_text %}
        <p class="help">{{ field.help_text }}</p>
    {% endif %}
    <div class="control{% if suggest_url %} suggest dropdown{% endif %}">
        <input class="input column is-half"
               id="{{ field.id_for_label }}"
               name="{{ field.html_name }}"
               {% if type %}type="{{ type }}"{% endif %}
               {% if field.value %}value="{{ field.value }}"{% endif %}
               {% if suggest_url %}
                   autocomplete="off"
                   role="combobox"
                   aria-autocomplete="list"
                   aria-expanded="false"
                   aria-controls="{{ field.id_for_label }}-suggestions"
                   hx-get="{{ suggest_url }}"
                   hx-trigger="input changed delay:300ms"
                   hx-target="#{{ field.id_for_label }}-suggestions"
                   hx-sync="this:replace"
                   data-suggest
               {% elif autocomplete %}
                   autocomplete="{{ autocomplete }}"
               {% endif %}
               {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}>
        {% if suggest_url %}
            <div class="dropdown-menu">
                <div class="dropdown-content" id="{{ field.id_for_label }}-suggestions" role="listbox"></div>
            </div>
        {% endif %}
    </div>
</div>
