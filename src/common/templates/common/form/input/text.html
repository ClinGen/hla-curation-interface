<div class="field">
    {% if hide_label %}
        <label class="label is-hidden" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <div class="has-text-danger">{{ field.errors }}</div>
    {% else %}
        <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if public %} {% include "common/public_badge.html" %}{% endif %}</label>
        <div class="has-text-danger">{{ field.errors }}</div>
    {% endif %}
    {% if show_help and field.help_text %}
        <p class="help">{{ field.help_text }}</p>
    {% endif %}
    <div class="control">
        <input class="input column is-half"
               id="{{ field.id_for_label }}"
               name="{{ field.html_name }}"
               {% if type %}type="{{ type }}"{% endif %}
               {% if field.value %}value="{{ field.value }}"{% endif %}
               {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
               {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
               {% if datalist %}list="{{ field.id_for_label }}-options"{% endif %}>
        {% if datalist %}
            <datalist id="{{ field.id_for_label }}-options">
                {% for value, label in datalist %}
                    <option value="{{ value }}">{{ label|default_if_none:"" }}</option>
                {% endfor %}
            </datalist>
        {% endif %}

    </div>
</div>
