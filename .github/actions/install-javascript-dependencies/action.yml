---
name: "Install JavaScript dependencies"
description: "Use npm to install JavaScript dependencies for the project"
runs:
  using: "composite"
  steps:
    - name: "Install Node.js"
      uses: "actions/setup-node@v4"
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
    - name: "Install JavaScript dependencies"
      shell: "bash"
      run: "npm ci"
